<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background: transparent !important;
      overflow: hidden !important;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Botón amarillo con la "i" más grande */
    .badge-btn {
      width: 36px;               /* Ancho del círculo (antes 26px) */
      height: 36px;              /* Alto del círculo (antes 26px) */
      border-radius: 50%;
      background-color: #F5A823; /* Amarillo institucional CNMH */
      color: #ffffff;
      font-size: 21px;           /* Tamaño de la letra "i" (antes 15px) */
      font-weight: 700;
      font-family: Georgia, serif;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      outline: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    /* Efecto al pasar el cursor por encima */
    .badge-btn:hover {
      background-color: #D98F15; /* Amarillo más oscuro en hover */
      transform: scale(1.08);
    }
  </style>
</head>
<body>

  <!-- Botón que abre la ventana emergente al hacer clic -->
  <button class="badge-btn" onclick="abrirGuia()" title="Cómo navegar y usar la herramienta">i</button>

  <script>
    function abrirGuia() {
      const urlGuia = 'https://jeisonsabogal.github.io/EnlacesDataStudio/guia_texto.html';
      const ancho = 540; /* Ancho de la ventana emergente */
      const alto = 620;  /* Alto de la ventana emergente */
      const left = (screen.width - ancho) / 2;
      const top = (screen.height - alto) / 2;

      window.open(
        urlGuia,
        'GuiaNavegacion',
        `width=${ancho},height=${alto},top=${top},left=${left},scrollbars=yes,resizable=yes`
      );
    }
  </script>

</body>
</html>
