<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background: transparent !important;
      overflow: visible !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      width: 100%;
      height: 100%;
    }
    .wrapper {
      position: absolute;
      bottom: 2px; /* Anclado al fondo para crecer hacia arriba */
      left: 2px;
      display: inline-block;
      cursor: help;
    }
    .icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: #5f6368;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background-color 0.2s ease;
    }
    .icon:hover {
      background-color: #1a73e8;
    }
    /* El tooltip ahora se despliega HACIA ARRIBA */
    .tooltip {
      display: none;
      position: absolute;
      bottom: 24px; /* Abre hacia arriba del icono */
      left: 0;
      width: 190px;
      background-color: #202124;
      color: #ffffff;
      font-size: 11px;
      line-height: 1.4;
      padding: 8px 10px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      pointer-events: none;
    }
    /* Flecha decorativa apuntando hacia abajo */
    .tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 5px;
      border-width: 5px;
      border-style: solid;
      border-color: #202124 transparent transparent transparent;
    }
    .wrapper:hover .tooltip {
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="icon">?</div>
    <div class="tooltip">
      Selecciona el rango de fechas para actualizar los mapas y el conteo de registros.
    </div>
  </div>
</body>
</html>
