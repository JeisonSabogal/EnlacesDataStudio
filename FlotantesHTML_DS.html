<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; padding: 4px; font-family: sans-serif; background: transparent; }
    .tooltip-box {
      position: relative;
      display: inline-block;
      cursor: help;
    }
    .icon {
      background: #5f6368;
      color: white;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
    }
    .tooltip-text {
      visibility: hidden;
      opacity: 0;
      width: 180px;
      background: #202124;
      color: #fff;
      font-size: 11px;
      border-radius: 4px;
      padding: 6px 8px;
      position: absolute;
      top: 22px;
      left: 0;
      z-index: 999;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: opacity 0.2s;
    }
    .tooltip-box:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="tooltip-box">
    <div class="icon">?</div>
    <div class="tooltip-text">Selecciona el rango de fechas para actualizar los mapas y el conteo de registros.</div>
  </div>
</body>
</html>
