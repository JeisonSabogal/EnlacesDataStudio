<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background: transparent !important;
      overflow: hidden !important;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: #5f6368;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s, transform 0.1s;
      border: none;
      outline: none;
    }
    .badge:hover {
      background-color: #1a73e8;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <!-- El title nativo muestra el tooltip clásico del navegador sin requerir espacio extra -->
  <button 
    class="badge" 
    title="Filtro de Fecha: Selecciona una fecha o periodo cronológico para filtrar los documentos y mapas."
    onclick="alert('Filtro de Fecha:\n\nSelecciona una fecha o periodo cronológico para filtrar los documentos y mapas.')">
    ?
  </button>
</body>
</html>
