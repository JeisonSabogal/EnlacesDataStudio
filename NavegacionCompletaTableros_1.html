<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background: transparent !important;
      overflow: hidden !important;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Botón 'i' con el amarillo institucional del isotipo */
    .badge-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: #F5A823; /* Amarillo del logo CNMH */
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      font-family: Georgia, serif;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      outline: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.22);
      transition: background-color 0.2s ease, transform 0.15s ease;
    }
    .badge-btn:hover {
      background-color: #D98F15; /* Tono de hover más intenso */
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- Al hacer clic, abre la ventana flotante centrada -->
  <button class="badge-btn" onclick="abrirGuia()" title="Cómo navegar y usar la herramienta">i</button>

  <script>
    function abrirGuia() {
      const urlGuia = 'https://jeisonsabogal.github.io/EnlacesDataStudio/guia_texto.html';
      const ancho = 540;
      const alto = 620;
      const left = (screen.width - ancho) / 2;
      const top = (screen.height - alto) / 2;
      
      window.open(
        urlGuia, 
        'GuiaNavegacion', 
        `width=${ancho},height=${alto},top=${top},left=${left},scrollbars=yes,resizable=yes`
      );
    }
  </script>

</body>
</html>
